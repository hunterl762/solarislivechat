<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solaris Live Chat Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#08050e;color:#fff;font:14px Inter,system-ui}button,input,select{font:inherit}.login{max-width:440px;margin:12vh auto;padding:32px;background:#130b1e;border:1px solid #54214e;border-radius:20px}.login input{width:100%;margin:7px 0;padding:13px;border-radius:10px;border:1px solid #49304f;background:#170e20;color:#fff}.btn{padding:11px 15px;border:0;border-radius:10px;background:linear-gradient(135deg,#7d2cff,#e52ba8);color:#fff;cursor:pointer}.shell{display:none;min-height:100vh}.nav{width:220px;background:#0d0814;border-right:1px solid #2d1935;padding:20px}.brand{font-size:20px;font-weight:800;margin-bottom:25px}.nav button{display:block;width:100%;text-align:left;margin:5px 0;padding:11px;border:0;border-radius:9px;background:transparent;color:#cdbbd4;cursor:pointer}.nav button.active,.nav button:hover{background:#21102a;color:#fff}.main{flex:1;padding:22px;min-width:0}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card{background:#130b1e;border:1px solid #302038;border-radius:15px;padding:17px}.card strong{display:block;font-size:25px;margin-top:8px}.workspace{display:grid;grid-template-columns:300px 1fr;min-height:65vh;border:1px solid #302038;border-radius:16px;overflow:hidden}.side{padding:15px;background:#100918;overflow:auto}.conv{padding:12px;margin:7px 0;background:#180e21;border:1px solid #34203d;border-radius:10px;cursor:pointer}.conv:hover,.conv.active{border-color:#d331ad}.badge{float:right;background:#e52ba8;border-radius:20px;padding:2px 7px}.chat{display:flex;flex-direction:column;min-width:0}.top{padding:15px;border-bottom:1px solid #302038;display:flex;justify-content:space-between}.msgs{flex:1;overflow:auto;padding:20px}.msg{max-width:72%;padding:10px 13px;margin:8px;border-radius:12px;background:#25172f}.msg.agent{margin-left:auto;background:#7f1764}.send{display:flex;gap:8px;padding:14px;border-top:1px solid #302038}.send input{flex:1;padding:12px;border:1px solid #49304f;border-radius:10px;background:#170e20;color:#fff}.panel{display:none}.panel.active{display:block}.agentrow{display:flex;justify-content:space-between;padding:13px;border-bottom:1px solid #302038}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ddd91;margin-right:6px}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.nav{width:75px}.nav span{display:none}.workspace{grid-template-columns:220px 1fr}}@media(max-width:650px){.nav{display:none}.main{padding:10px}.cards{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr}.side{max-height:220px}}</style></head><body><div class="login"><h1>Solaris Live Chat</h1><p>Administration Console</p><input id="username" placeholder="Username" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" id="login">Sign In</button><p id="err"></p></div><div class="shell"><aside class="nav"><div class="brand">☀ Solaris</div><button class="active" data-page="dashboard">◈ <span>Dashboard</span></button><button data-page="agents">♙ <span>Agents</span></button><button id="notify">🔔 <span>Notifications</span></button><button id="logout">↪ <span>Logout</span></button></aside><main class="main"><section id="dashboard" class="panel active"><div class="header"><div><h1>Live Chat Dashboard</h1><small id="who"></small></div><span><i class="dot"></i>Live</span></div><div class="cards"><div class="card">Open chats<strong id="openCount">0</strong></div><div class="card">Total chats<strong id="totalCount">0</strong></div><div class="card">Unread<strong id="unreadCount">0</strong></div><div class="card">Online agents<strong id="agentCount">0</strong></div></div><div class="workspace"><aside class="side"><input id="search" placeholder="Search conversations" style="width:100%;padding:10px;background:#170e20;color:white;border:1px solid #49304f;border-radius:9px"><div id="list"></div></aside><div class="chat"><div class="top"><b id="title">Select a conversation</b><button class="btn" id="close">Close Chat</button></div><div class="msgs" id="msgs"></div><form class="send"><input id="text" placeholder="Reply to customer…"><button class="btn">Send</button></form></div></div></section><section id="agents" class="panel"><div class="header"><div><h1>Agent Management</h1><p>Create and manage support staff.</p></div></div><div class="card"><h3>Add agent</h3><input id="newUser" placeholder="Username"> <input id="newName" placeholder="Display name"> <input id="newPass" type="password" placeholder="Temporary password"> <select id="newRole"><option value="agent">Agent</option><option value="admin">Admin</option></select> <button class="btn" id="addAgent">Create</button><p id="agentErr"></p><div id="agentList"></div></div></section></main></div><script src="/socket.io/socket.io.js"></script><script>
function $(q){return document.querySelector(q)}const s=io(),login=document.querySelector('.login'),shell=document.querySelector('.shell'),list=$('#list'),msgs=$('#msgs'),adminSound=new Audio('/sounds/admin-notification.mp3');adminSound.preload='auto';adminSound.volume=.75;let audioUnlocked=false,active=null,all=new Map(),unread=new Map(),me=null,originalTitle=document.title;function token(){return sessionStorage.getItem('solarisChatAdminToken')}function unlockAudio(){if(audioUnlocked)return;adminSound.muted=true;adminSound.play().then(()=>{adminSound.pause();adminSound.currentTime=0;adminSound.muted=false;audioUnlocked=true}).catch(()=>{adminSound.muted=false})}function playAdminSound(){adminSound.currentTime=0;adminSound.play().catch(e=>console.debug('[Solaris Live Chat] Admin notification sound blocked:',e?.message||e))}
async function signIn(){unlockAudio();let err=$('#err');err.textContent='Signing in…';try{let r=await fetch('/api/chat/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#username').value.trim(),password:$('#password').value})}),d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');sessionStorage.setItem('solarisChatAdminToken',d.token);s.emit('agent:join',{token:d.token})}catch(e){err.textContent=e.message}}
$('#login').onclick=signIn;$('#password').onkeydown=e=>{if(e.key==='Enter')signIn()};s.on('agent:error',e=>{$('#err').textContent=e});s.on('agent:ready',p=>{me=p.user;login.style.display='none';shell.style.display='flex';$('#who').textContent='Signed in as '+p.user.displayName+' • '+p.user.role;p.conversations.forEach(update);loadAgents()});s.on('agent:presence',p=>{$('#agentCount').textContent=p.count});s.on('conversation:update',c=>{let old=all.get(c.id);update(c);if(old&&c.messages.length>old.messages.length&&c.messages.at(-1)?.sender==='visitor'){playAdminSound();if(active!==c.id){unread.set(c.id,(unread.get(c.id)||0)+1);notify('New message from '+c.name,c.messages.at(-1).text);renderList();stats()}}});s.on('chat:message',m=>{if(active)add(m)});
function update(c){all.set(c.id,c);renderList();if(active===c.id)render(c);stats()}function stats(){$('#openCount').textContent=[...all.values()].filter(c=>c.status==='open').length;$('#totalCount').textContent=all.size;let n=[...unread.values()].reduce((a,b)=>a+b,0);$('#unreadCount').textContent=n;document.title=n?'('+n+') '+originalTitle:originalTitle}function renderList(){let q=$('#search').value.toLowerCase();list.innerHTML='';[...all.values()].filter(c=>(c.name+' '+c.email).toLowerCase().includes(q)).sort((a,b)=>b.createdAt-a.createdAt).forEach(c=>{let d=document.createElement('div');d.className='conv'+(active===c.id?' active':'');d.innerHTML='<b>'+esc(c.name)+'</b>'+(unread.get(c.id)?'<span class="badge">'+unread.get(c.id)+'</span>':'')+'<br><small>'+c.status+' • '+c.messages.length+' messages</small>';d.onclick=()=>{unlockAudio();active=c.id;unread.delete(c.id);s.emit('agent:watch',{conversationId:c.id});render(c);renderList();stats()};list.appendChild(d)})}$('#search').oninput=renderList;function render(c){$('#title').textContent=c.name+' • '+c.status;msgs.innerHTML='';c.messages.forEach(add)}function add(m){let d=document.createElement('div');d.className='msg '+m.sender;d.textContent=(m.sender==='agent'&&m.agentName?m.agentName+': ':'')+m.text;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}$('.send').onsubmit=e=>{e.preventDefault();unlockAudio();let i=$('#text');if(active&&i.value.trim())s.emit('chat:message',{conversationId:active,text:i.value});i.value=''};$('#close').onclick=()=>active&&s.emit('conversation:close',{conversationId:active});
function notify(title,body){if('Notification'in window&&Notification.permission==='granted'&&document.hidden)new Notification(title,{body})}$('#notify').onclick=async()=>{unlockAudio();if('Notification'in window)await Notification.requestPermission();playAdminSound()};$('#logout').onclick=()=>{sessionStorage.removeItem('solarisChatAdminToken');location.reload()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{unlockAudio();document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));$('#'+b.dataset.page).classList.add('active');document.querySelectorAll('[data-page]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token(),'Content-Type':'application/json'};let r=await fetch(url,opt),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function loadAgents(){try{let d=await api('/api/chat/admin/users');$('#agentList').innerHTML=d.users.map(u=>'<div class="agentrow"><span><b>'+esc(u.display_name)+'</b><br><small>@'+esc(u.username)+' • '+u.role+'</small></span><span>'+(u.is_active?'Active':'Disabled')+'</span></div>').join('')}catch(e){$('#agentErr').textContent=e.message}}$('#addAgent').onclick=async()=>{try{await api('/api/chat/admin/users',{method:'POST',body:JSON.stringify({username:$('#newUser').value,displayName:$('#newName').value,password:$('#newPass').value,role:$('#newRole').value})});$('#agentErr').textContent='Account created.';loadAgents()}catch(e){$('#agentErr').textContent=e.message}};function esc(x){return String(x||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}let saved=token();if(saved)s.emit('agent:join',{token:saved});
</script></body></html>
