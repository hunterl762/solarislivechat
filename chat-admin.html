<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solaris Live Chat Console</title><style>body{margin:0;background:#08050e;color:#fff;font-family:Inter,system-ui}*{box-sizing:border-box}.login{max-width:440px;margin:15vh auto;padding:30px;background:#130b1e;border:1px solid #54214e;border-radius:18px}input,button{padding:12px;border-radius:10px;border:1px solid #49304f;background:#170e20;color:#fff}button{background:#bd218f;cursor:pointer}.app{display:none;height:100vh}.side{width:330px;border-right:1px solid #39203e;padding:18px;overflow:auto}.chat{flex:1;display:flex;flex-direction:column}.conv{padding:12px;margin:7px 0;background:#140d1d;border:1px solid #33203b;border-radius:10px;cursor:pointer}.conv:hover{border-color:#d331ad}.msgs{flex:1;overflow:auto;padding:25px}.msg{max-width:70%;padding:10px 13px;margin:8px;border-radius:12px;background:#25172f}.msg.agent{margin-left:auto;background:#a31c7d}.send{display:flex;gap:8px;padding:16px;border-top:1px solid #39203e}.send input{flex:1}.top{padding:18px;border-bottom:1px solid #39203e;display:flex;justify-content:space-between}@media(max-width:700px){.side{width:38%}}</style></head><body><div class="login"><h1>Solaris Live Chat</h1><p>Agent Console</p><input id="username" autocomplete="username" placeholder="Username"><br><br><input id="password" type="password" autocomplete="current-password" placeholder="Password"> <button id="login" type="button">Sign In</button><p id="err"></p></div><div class="app"><aside class="side"><h2>Conversations</h2><div id="list"></div></aside><main class="chat"><div class="top"><b id="title">Select a conversation</b><button id="close">Close Chat</button></div><div class="msgs" id="msgs"></div><form class="send"><input id="text" placeholder="Reply to customer…"><button>Send</button></form></main></div><script src="/socket.io/socket.io.js"></script><script>
const s=io(),login=document.querySelector('.login'),app=document.querySelector('.app'),list=document.querySelector('#list'),msgs=document.querySelector('#msgs');let active=null,all=new Map();
async function signIn(){const err=document.querySelector('#err'),btn=document.querySelector('#login');err.textContent='Signing in…';btn.disabled=true;try{const username=document.querySelector('#username').value.trim(),password=document.querySelector('#password').value;if(!username||!password)throw new Error('Enter your username and password.');const r=await fetch('/api/chat/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});let data={};try{data=await r.json()}catch{throw new Error('The server returned an invalid response. Check that the live chat Node server is running.')}if(!r.ok)throw new Error(data.error||('Login failed (HTTP '+r.status+').'));sessionStorage.setItem('solarisChatAdminToken',data.token);s.emit('agent:join',{token:data.token})}catch(e){err.textContent=e.message}finally{btn.disabled=false}}
document.querySelector('#login').addEventListener('click',signIn);document.querySelector('#password').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();signIn()}});
s.on('connect_error',()=>{document.querySelector('#err').textContent='Cannot connect to the live chat server.'});s.on('agent:error',e=>{document.querySelector('#err').textContent=e;sessionStorage.removeItem('solarisChatAdminToken')});
s.on('agent:ready',payload=>{login.style.display='none';app.style.display='flex';document.querySelector('#title').textContent='Signed in as '+payload.user.displayName;payload.conversations.forEach(update)});s.on('conversation:update',update);s.on('chat:message',m=>{if(active)add(m)});
function update(c){all.set(c.id,c);renderList();if(active===c.id)render(c)}function renderList(){list.innerHTML='';[...all.values()].sort((a,b)=>b.createdAt-a.createdAt).forEach(c=>{let d=document.createElement('div');d.className='conv';d.innerHTML='<b>'+esc(c.name)+'</b><br><small>'+c.status+' • '+c.messages.length+' messages</small>';d.onclick=()=>{active=c.id;s.emit('agent:watch',{conversationId:c.id});render(c)};list.appendChild(d)})}function render(c){document.querySelector('#title').textContent=c.name+' • '+c.id.slice(0,8);msgs.innerHTML='';c.messages.forEach(add)}function add(m){let d=document.createElement('div');d.className='msg '+m.sender;d.textContent=(m.sender==='agent'&&m.agentName?m.agentName+': ':'')+m.text;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}document.querySelector('.send').onsubmit=e=>{e.preventDefault();let i=document.querySelector('#text');if(active&&i.value.trim())s.emit('chat:message',{conversationId:active,text:i.value});i.value=''};document.querySelector('#close').onclick=()=>active&&s.emit('conversation:close',{conversationId:active});function esc(x){return String(x||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
const saved=sessionStorage.getItem('solarisChatAdminToken');if(saved)s.emit('agent:join',{token:saved});
</script></body></html>
